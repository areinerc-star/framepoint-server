<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Framepoint Server API</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; text-align: center; border: 1px solid #334155; max-width: 450px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    h1 { margin-top: 0; color: #10b981; font-size: 1.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    .status-badge { display: inline-block; background: #064e3b; color: #34d399; padding: 4px 12px; border-radius: 9999px; font-weight: 600; font-size: 0.85rem; margin-bottom: 1rem; }
    code { background: #0f172a; color: #38bdf8; padding: 3px 8px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">● API Active</div>
    <h1>Framepoint Server</h1>
    <p>The backend serverless API is online and ready for requests.</p>
    <p>Health Endpoint: <code>/api/health</code></p>
    <p>Booking Endpoint: <code>/api/booking</code></p>
  </div>
</body>
</html>
